<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .emblem-bg { fill: #ffffff; }
      .blue-line { stroke: #0A5A9C; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .blue-thick { stroke: #0A5A9C; stroke-width: 4.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .blue-fill { fill: #0A5A9C; }
      .letter { font-family: 'Times New Roman', 'Georgia', 'Playfair Display', serif; font-weight: 900; fill: #0A5A9C; font-size: 19px; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(22, -3.5) scale(0.56)">
    <!-- White fill for inside the emblem so it stands out on both dark and light browser tabs -->
    <path class="emblem-bg" d="M 10,60 A 40,40 0 0,1 90,60 L 90,172 L 10,172 Z" />

    <!-- Outer Arch Frame -->
    <path class="blue-thick" d="M 10,60 A 40,40 0 0,1 90,60 L 90,172 L 10,172 Z" />
    
    <!-- Inner Arch Frame line -->
    <path class="blue-line" d="M 14,60 A 36,36 0 0,1 86,60 L 86,168 L 14,168 Z" />

    <!-- Horizontal transom bar -->
    <line class="blue-thick" x1="10" y1="60" x2="90" y2="60" />
    <line class="blue-line" x1="14" y1="64" x2="86" y2="64" />
    
    <!-- Sunburst Arch Arc -->
    <path class="blue-line" d="M 26,60 A 24,24 0 0,1 74,60" />
    
    <!-- Central Hub -->
    <path class="blue-fill" d="M 42,60 A 8,8 0 0,1 58,60 Z" />

    <!-- Sunburst Spokes Outer -->
    <line class="blue-line" x1="20" y1="41" x2="31" y2="47" />
    <line class="blue-line" x1="33" y1="28" x2="41" y2="39" />
    <line class="blue-line" x1="50" y1="22" x2="50" y2="36" />
    <line class="blue-line" x1="67" y1="28" x2="59" y2="39" />
    <line class="blue-line" x1="80" y1="41" x2="69" y2="47" />

    <!-- Sunburst Spokes Inner -->
    <line class="blue-line" x1="31" y1="47" x2="44" y2="56" />
    <line class="blue-line" x1="41" y1="39" x2="47" y2="54" />
    <line class="blue-line" x1="50" y1="36" x2="50" y2="53" />
    <line class="blue-line" x1="59" y1="39" x2="53" y2="54" />
    <line class="blue-line" x1="69" y1="47" x2="56" y2="56" />

    <!-- Perspective Ceiling & Floor Lines -->
    <polygon class="blue-line" points="14,64 32,77 68,77 86,64" />
    <polygon class="blue-line" points="14,168 32,155 68,155 86,168" />

    <!-- Central doorway vertical borders -->
    <line class="blue-thick" x1="32" y1="77" x2="32" y2="155" />
    <line class="blue-thick" x1="68" y1="77" x2="68" y2="155" />

    <!-- Left vertical louvers/pillars -->
    <line class="blue-line" x1="20" y1="68" x2="20" y2="164" />
    <line class="blue-line" x1="26" y1="72" x2="26" y2="160" />

    <!-- Right vertical louvers/pillars -->
    <line class="blue-line" x1="80" y1="68" x2="80" y2="164" />
    <line class="blue-line" x1="74" y1="72" x2="74" y2="160" />

    <!-- Letters INDU -->
    <text x="50" y="94" class="letter">I</text>
    <text x="50" y="114" class="letter">N</text>
    <text x="50" y="134" class="letter">D</text>
    <text x="50" y="153" class="letter">U</text>
  </g>
</svg>